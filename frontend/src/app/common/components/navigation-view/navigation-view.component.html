<div [insideClick]="true" class="btn-group" dropdown>
  <button aria-label="Display" class="btn btn-default dropdown-toggle" dropdownToggle type="button">
    <fa-icon [icon]="galleryModeEnabled ? icons.faTableCellsLarge : icons.faThList"></fa-icon>
  </button>
  <ul *dropdownMenu class="dropdown-menu dropdown-menu-right navigation-view-menu">
    <li class="dropdown-header text-bold" l10nTranslate>Display</li>
    <li class="px-1">
      <div aria-label="Display mode" class="navigation-view-mode-selector" role="group">
        <button (click)="setView('tl')"
                [attr.aria-pressed]="!galleryModeEnabled"
                [class.active]="!galleryModeEnabled"
                class="dropdown-item navigation-view-option"
                type="button">
          <fa-icon [icon]="icons.faThList"></fa-icon>
          <span l10nTranslate>List</span>
        </button>
        <button (click)="selectGalleryMode()"
                [attr.aria-pressed]="galleryModeEnabled"
                [class.active]="galleryModeEnabled"
                class="dropdown-item navigation-view-option"
                type="button">
          <fa-icon [icon]="icons.faTableCellsLarge"></fa-icon>
          <span l10nTranslate>Gallery</span>
        </button>
      </div>
    </li>
    @if (galleryModeEnabled) {
      <li class="dropdown-header text-bold mt-1" l10nTranslate>Size</li>
      <li class="px-1">
        <div aria-label="Gallery size" class="navigation-view-size-selector" role="group">
          @for (view of galleryViewOptions; track view.key) {
            <button (click)="setView(view.key)"
                    [attr.aria-pressed]="viewMode === view.key"
                    [class.active]="viewMode === view.key"
                    class="dropdown-item navigation-view-size-option"
                    type="button">
              {{ view.label }}
            </button>
          }
        </div>
      </li>
    }
  </ul>
</div>
