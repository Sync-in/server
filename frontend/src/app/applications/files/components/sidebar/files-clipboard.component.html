<div class="sidebar-component-title justify-content-between position-relative">
  <div class="sidebar-component-title-side">
    <fa-icon class="cursor-pointer"
             [icon]="icons.faQuestion"
             [tooltip]="'Actions will be performed in the current folder' | translate:locale.language"
             container="body"
             placement="left">
    </fa-icon>
  </div>
  <div class="sidebar-component-title-label" l10nTranslate>Clipboard</div>
  <div class="sidebar-component-title-side">
    <button (click)="clearAll()" class="btn btn-sm btn-default" type="button">
      <fa-icon [icon]="icons.faTimes"></fa-icon>
    </button>
  </div>
</div>
@if (files.length) {
  <div class="px-2 pt-2 pb-2 fs-xs">
    <div class="d-flex justify-content-between mt-2">
      <select [(ngModel)]="selectedAction" class="form-select form-select-sm">
        @for (item of operations| keyvalue: originalOrderKeyValue; track item.key) {
          <option [ngValue]="item.key" l10nTranslate>{{ item.value.text }}</option>
        }
      </select>
      <button (click)="doAction()" class="btn btn-xs btn-primary ms-1" type="button" l10nTranslate>Confirm</button>
    </div>
  </div>
  <hr class="mx-0 my-2">
  <div appAutoResize class="sidebar-item" [resizeOffset]=120>
    @for (f of files; track f.id) {
      <div class="sidebar-item-container">
        <div class="sidebar-item-content" [tooltip]="f.path">
          <img [src]="f.mimeUrl" alt="" height="28" width="28" (error)="f.fallBackMimeUrl()">
          <div class="text-truncate fs-sm">{{ f.name }}</div>
          <button (click)="remove(f)" class="btn btn-xs btn-default ms-auto">
            <fa-icon [icon]="icons.faTimes"></fa-icon>
          </button>
        </div>
      </div>
    }
  </div>
}
