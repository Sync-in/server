<!-- The user image in the menu -->
<div class="d-flex flex-column">
  <div class="sidebar-component-title app-top-menu-tool-bar">
    <div class="d-flex flex-fill justify-content-between">
      @if (!user?.isLink) {
        <button class="btn btn-default"
                (click)="collapseRSideBar()"
                type="button"
                [attr.aria-label]="'Account' | translate:locale.language"
                [title]="'Account' | translate:locale.language"
                [routerLink]=USER_PATH.BASE>
          <svg [lucideIcon]="icons.LucideUserRound"></svg>
        </button>
      }
      <app-theme-switch (themeChange)="toggleTheme($event)"></app-theme-switch>
      @if (user?.isAdmin) {
        <button class="btn btn-default"
                (click)="collapseRSideBar()"
                type="button"
                [attr.aria-label]="'Administration' | translate:locale.language"
                [title]="'Administration' | translate:locale.language"
                routerLink="/admin">
          <svg [lucideIcon]="icons.LucideSettings"></svg>
        </button>
      }
      @if (!store.isElectronApp() || store.isElectronApp() && store.userImpersonate()) {
        <button (click)="logOut()"
                class="btn btn-default"
                [attr.aria-label]="'logout' | translate:locale.language"
                [title]="'logout' | translate:locale.language"
                type="button">
          <svg [lucideIcon]="store.userImpersonate() ? icons.LucideVenetianMask : icons.LucideLogOut"></svg>
        </button>
      }
    </div>
  </div>
  <div appAutoResize [useMaxHeight]="false" class="d-flex flex-column">
    <div class="user-header py-3 px-3">
      <div class="d-flex flex-column justify-content-center me-2">
        <div class="avatar-lg">
          <img class="avatar-img" [src]="userAvatar" alt="">
          <span class="avatar-{{allOnlineStatus[user?.onlineStatus]}}"></span>
        </div>
      </div>
      <div class="user-details">
        @if (user?.isLink) {
          <div l10nTranslate>Guest Link</div>
        } @else {
          <div>{{ user?.fullName }}</div>
          <div class="fs-xs mt-1">{{ user?.email }}</div>
        }
        <select [ngModel]="user?.onlineStatus"
                (ngModelChange)="setOnlineStatus($event)"
                class="form-select form-select-sm mt-2">
          @for (s of allOnlineStatus; track $index) {
            <option [ngValue]="allOnlineStatus.indexOf(s)">{{ s | translate:locale.language | capitalize }}</option>
          }
        </select>
      </div>
    </div>
    <hr class="my-0 w-100" />
    <div class="mt-auto">
      <hr class="my-0 w-100" />
      <div class="profile-sync-in-footer">
        <div class="profile-sync-in-brand">
          <span aria-hidden="true" class="sync-in-logo sync-in-logo--themed"></span>
          <span class="profile-sync-in-version">v{{ appVersion }}</span>
        </div>
        <div class="d-flex">
          <a class="text-primary cursor-pointer" (click)="openLink('website')" l10nTranslate>Website</a>
          <span>&nbsp;|&nbsp;</span>
          <a class="text-primary cursor-pointer" (click)="openLink('versions')" l10nTranslate>Versions</a>
          <span>&nbsp;|&nbsp;</span>
          <a class="cursor-pointer" (click)="openLink('support')"> 💛</a>
          <button class="ms-auto fs-xs cursor-pointer border-0 bg-transparent p-0 text-reset"
                  type="button"
                  (click)="layout.setAutoCollapseRSideBarPreference(!layout.collapseRSideBarPreference())"
                  [attr.aria-label]="(layout.collapseRSideBarPreference() ? 'Sidebar auto-hide enabled' : 'Sidebar pinned') | translate:locale.language"
                  [title]="(layout.collapseRSideBarPreference() ? 'Sidebar auto-hide enabled' : 'Sidebar pinned') | translate:locale.language">
            <svg [lucideIcon]="layout.collapseRSideBarPreference() ? icons.LucidePinOff : icons.LucidePin"></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
