<div class="breadcrumb">
  <div #breadcrumbContent class="breadcrumb-content">
    @for (item of levels; track $index) {
      @if (!$first) {
        <svg
          [lucideIcon]="icons.LucideChevronRight">
        </svg>
      }
      <li
        [class.breadcrumb-mobile-active]="!$first && $last"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'ignored'}">
        <a [routerLink]="item.link">
          @if ($first && breadcrumbIcon) {
            <svg [lucideIcon]="breadcrumbIcon"></svg>
          }
          <span>{{ item.title }}</span>
        </a>
        @if ($first && !$last) {
          <span class="breadcrumb-overflow-marker" aria-hidden="true">...</span>
        }
      </li>
    }
  </div>
</div>
