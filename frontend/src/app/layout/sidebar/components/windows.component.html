<div class="sidebar-component-title justify-content-between position-relative">
  <div class="sidebar-component-title-side"></div>
  <div class="sidebar-component-title-label" l10nTranslate>Windows Manager</div>
  <div class="sidebar-component-title-side">
    @if (windows.length) {
      <button (click)="onCloseAll()" class="btn btn-sm btn-default" type="button" aria-label="Close all windows">
        <fa-icon [icon]="icons.faTimes"></fa-icon>
      </button>
    }
  </div>
</div>
<div class="sidebar-item" appAutoResize>
  @for (modal of windows; track modal.id) {
    <div class="sidebar-item-container cursor-pointer" (click)="onMaximize(modal)">
      <div class="sidebar-item-content">
        <img [ngSrc]="modal.element.mimeUrl" alt="" width="28" height="28">
        <div class="text-truncate fs-sm">{{ modal.element.name }}</div>
        <button (click)="onClose($event, modal)" class="btn btn-xs btn-default ms-auto">
          <fa-icon [icon]="icons.faTimes"></fa-icon>
        </button>
      </div>
    </div>
  }
</div>
